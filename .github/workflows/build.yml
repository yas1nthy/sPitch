
name: Build sPitch Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "sPitch-windows-build-kit.zip" -DestinationPath "." -Force
          if (!(Test-Path "sPitch/CMakeLists.txt")) {
            throw "Project CMakeLists.txt not found!"
          }

      - name: Generate JUCE header
        shell: pwsh
        run: |
          $path = "sPitch/CMakeLists.txt"
          $content = Get-Content $path -Raw
          $marker = "target_sources(sPitch PRIVATE"
          if (!$content.Contains("juce_generate_juce_header(sPitch)")) {
            if (!$content.Contains($marker)) {
              throw "Cannot find target_sources in CMakeLists.txt"
            }
            $content = $content.Replace(
              $marker,
              "juce_generate_juce_header(sPitch)`r`n`r`n$marker"
            )
            Set-Content -Path $path -Value $content -Encoding utf8
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S sPitch -B sPitch/build -G "Visual Studio 17 2022" -A x64
          if errorlevel 1 exit /b 1

      - name: Compile VST3
        shell: cmd
        run: |
          cmake --build sPitch/build --config Release --target sPitch_VST3 sPitch_Standalone --parallel
          if errorlevel 1 exit /b 1

      - name: Create EXE Installer
        shell: cmd
        working-directory: sPitch
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\sPitch.iss
          if errorlevel 1 exit /b 1

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: sPitch-Windows-Installer
          path: sPitch/installer/Output/sPitch-Setup-0.1.0-x64.exe
          if-no-files-found: error
